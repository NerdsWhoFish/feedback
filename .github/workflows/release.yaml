name: Release
on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - run: npm install --global pnpm@10.28.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: NerdsWhoFish/quill@v1
        with:
          scope: ${{ inputs.scope }}
          bump: ${{ inputs.bump }}
          publish: goreleaser,docker
          goreleaser-version: v2.19.0
          docker-images: ghcr.io/nerdswhofish/feedback
          docker-platforms: linux/amd64,linux/arm64
          # Stable images must consume the final release build, never a snapshot.
          docker-dry-run: "false"
          docker-cache: "false"
          docker-sbom: "true"
          docker-provenance: mode=max
