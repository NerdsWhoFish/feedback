name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback-ci
          POSTGRES_DB: feedback_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feedback -d feedback_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOWORK: "off"
      TEST_DATABASE_URL: postgres://feedback:feedback-ci@127.0.0.1:5432/feedback_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
      - run: npm install --global pnpm@10.28.2
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint && pnpm --dir web typecheck && pnpm --dir web build
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: pnpm --dir web audit --prod
      - run: CGO_ENABLED=0 go build -trimpath -o bin/feedback ./cmd/feedback
  release-check:
    needs: test
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-dry-run.yaml
